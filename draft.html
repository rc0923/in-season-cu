<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The ISC Draft</title>
  <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
  <link rel="shortcut icon" href="favicons/favicon.ico">
  <link rel="manifest" href="favicons/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── connection pill ── */
    .conn { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .conn.live { color: var(--green); }
    .conn.down { color: var(--red); }

    /* ── password gate ── */
    .gate-error { color: var(--red); font-size: 13px; margin-top: 14px; }
    .linkish {
      background: none; border: none; cursor: pointer; padding: 0;
      font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--text-dim);
    }
    .linkish:hover { color: var(--gold); }

    /* ── admin ── */
    .admin-bar { border: 1px dashed var(--gold-dim); }
    .btn.danger { border-color: rgba(230,57,70,0.5); color: var(--red); }
    .btn.danger:hover { border-color: var(--red); background: rgba(230,57,70,0.08); }
    .seat { position: relative; }
    .seat-kick {
      position: absolute; top: 4px; right: 6px; background: none; border: none;
      color: var(--text-dim); font-size: 13px; cursor: pointer; line-height: 1; padding: 2px 4px;
    }
    .seat-kick:hover { color: var(--red); }
    .roster .slot.editable { cursor: pointer; border-radius: 4px; }
    .roster .slot.editable:hover { background: rgba(255,255,255,0.05); color: var(--gold); }
    .roster .slot.replacing { background: rgba(245,166,35,0.14); color: var(--gold); }

    /* ── practice banner ── */
    .practice-banner {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: rgba(245,166,35,0.08); border: 1px dashed var(--gold-dim);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
      color: var(--text-dim); font-size: 13px;
    }
    .pb-tag {
      font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--rink); background: var(--gold);
      padding: 3px 8px; border-radius: 4px; font-weight: 500;
    }
    .bots-warning { background: rgba(230,57,70,0.08); border-color: var(--red); }
    .pb-tag.warn { background: var(--red); color: #fff; }

    /* ── lobby ── */
    .lobby { text-align: center; padding: 40px 24px; }
    .lobby h2 { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 2px; color: var(--gold); }
    .lobby .hint { color: var(--text-dim); font-size: 14px; margin-top: 6px; }

    .join-form { display: flex; gap: 10px; justify-content: center; margin: 28px 0 8px; flex-wrap: wrap; }
    .join-form input {
      background: var(--rink-mid); border: 1px solid var(--line); color: var(--text);
      padding: 12px 16px; border-radius: 6px; font-family: 'DM Sans', sans-serif;
      font-size: 16px; width: 240px; max-width: 100%;
    }
    .join-form input:focus { outline: none; border-color: var(--gold); }

    .btn {
      background: var(--gold); color: var(--rink); border: none; padding: 12px 24px;
      border-radius: 6px; font-family: 'DM Sans', sans-serif; font-weight: 500;
      font-size: 15px; cursor: pointer;
    }
    .btn:hover { background: #ffb733; }
    .btn:disabled { background: var(--rink-light); color: var(--text-dim); cursor: not-allowed; }
    .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text-dim); }
    .btn.ghost:hover { border-color: var(--gold); color: var(--gold); }

    .seats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 30px 0 10px; }
    .seat {
      min-width: 130px; padding: 16px 12px; border-radius: 8px;
      background: var(--rink-mid); border: 1px solid var(--line);
    }
    .seat.filled { border-color: var(--gold-dim); background: var(--rink-light); }
    .seat.me { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .seat .who { font-size: 16px; font-weight: 500; }
    .seat .tag { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }
    .seat.empty .who { color: var(--text-dim); font-style: italic; }
    .seat.bot { border-style: dashed; }
    .seat.bot .who { color: var(--text-dim); }

    /* ── order strip ── */
    .order-strip { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 4px; }
    .order-chip {
      font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px;
      padding: 6px 12px; border-radius: 20px; background: var(--rink-mid);
      border: 1px solid var(--line); color: var(--text-dim);
    }
    .order-chip.active { background: var(--gold); color: var(--rink); border-color: var(--gold); font-weight: 500; }

    /* ── clock ── */
    .clock { text-align: center; padding: 22px 16px; }
    .clock .meta { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
    .clock .who { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 2px; margin-top: 6px; }
    .clock.mine .who { color: var(--gold); }
    .clock .sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

    /* ── team board ── */
    .board {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px; padding: 4px 0;
    }
    .team-btn {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      background: var(--rink-mid); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 12px; cursor: pointer; text-align: left;
      font-family: 'DM Sans', sans-serif; transition: border-color .12s, background .12s;
    }
    .team-btn .abbr { font-family: 'DM Mono', monospace; font-weight: 500; letter-spacing: 1px; font-size: 14px; }
    .team-btn .full { font-size: 11px; color: var(--text-dim); }
    .team-btn:not(:disabled):hover { border-color: var(--gold); background: var(--rink-light); }
    .team-btn:disabled { cursor: not-allowed; opacity: .38; }
    .team-btn.taken { opacity: 1; background: transparent; border-style: dashed; }
    .team-btn.taken .abbr { text-decoration: line-through; color: var(--text-dim); }
    .team-btn.taken .owner { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: var(--gold-dim); text-transform: uppercase; }
    .team-btn.champ { border-color: var(--gold); }
    .team-btn .crown { font-size: 10px; color: var(--gold); letter-spacing: 1px; font-family: 'DM Mono', monospace; }

    /* ── rosters ── */
    .rosters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .roster { background: var(--rink-mid); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .roster.me { border-color: var(--gold-dim); }
    .roster h3 { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 8px; }
    .roster .slot { font-family: 'DM Mono', monospace; font-size: 12px; padding: 3px 0; color: var(--text-dim); }
    .roster .slot.filled { color: var(--text); }
    .roster .slot .n { color: var(--text-dim); margin-right: 8px; }

    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: var(--red); color: #fff; padding: 10px 18px; border-radius: 6px;
      font-size: 14px; z-index: 50;
    }

    .done-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
    pre.json {
      background: var(--rink-mid); border: 1px solid var(--line); border-radius: 8px;
      padding: 14px; overflow-x: auto; font-family: 'DM Mono', monospace; font-size: 11px;
      color: var(--text-dim); max-height: 320px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header class="section">
      <div class="logo-area">
        <h1>The ISC Draft</h1>
        <div class="subtitle" id="season-sub">Connecting…</div>
      </div>
      <div class="header-right">
        <a href="index.html" class="summary-link">← Tracker</a>
        <button class="linkish" id="admin-link" onclick="openGate()">Admin</button>
        <div class="updated-badge"><span class="conn" id="conn">connecting</span></div>
      </div>
    </header>

    <div id="stage"></div>
  </div>

  <script>
    // ── config ───────────────────────────────────────────────────────────────
    // ?worker= and ?room= exist so this page can be pointed at a local wrangler
    // dev server during testing. Bump DEFAULT_ROOM alongside the season vars in
    // worker/wrangler.jsonc when a new season is drafted.
    const params = new URLSearchParams(location.search);
    const WORKER = (params.get('worker') ?? 'https://isc-draft.rc0923.workers.dev').replace(/\/$/, '');
    const DEFAULT_ROOM = '2026-27';
    const ROOM = params.get('room') ?? DEFAULT_ROOM;
    const SEAT_KEY = `isc-draft-seat:${ROOM}`;
    // Remembered so a reload or a dropped connection mid-draft does not lock you
    // out. Deliberately not carried in the URL, where it would leak into history.
    const PW_KEY = `isc-draft-pw:${ROOM}`;

    const TEAM_NAMES = {
      ANA: 'Anaheim Ducks', BOS: 'Boston Bruins', BUF: 'Buffalo Sabres',
      CGY: 'Calgary Flames', CAR: 'Carolina Hurricanes', CHI: 'Chicago Blackhawks',
      COL: 'Colorado Avalanche', CBJ: 'Columbus Blue Jackets', DAL: 'Dallas Stars',
      DET: 'Detroit Red Wings', EDM: 'Edmonton Oilers', FLA: 'Florida Panthers',
      LAK: 'Los Angeles Kings', MIN: 'Minnesota Wild', MTL: 'Montreal Canadiens',
      NSH: 'Nashville Predators', NJD: 'New Jersey Devils', NYI: 'New York Islanders',
      NYR: 'New York Rangers', OTT: 'Ottawa Senators', PHI: 'Philadelphia Flyers',
      PIT: 'Pittsburgh Penguins', SJS: 'San Jose Sharks', SEA: 'Seattle Kraken',
      STL: 'St. Louis Blues', TBL: 'Tampa Bay Lightning', TOR: 'Toronto Maple Leafs',
      UTA: 'Utah Mammoth', VAN: 'Vancouver Canucks', VGK: 'Vegas Golden Knights',
      WSH: 'Washington Capitals', WPG: 'Winnipeg Jets',
    };

    const ERRORS = {
      room_full: 'The room is already full.',
      name_taken: 'Somebody already took that name.',
      name_required: 'Enter a name first.',
      draft_already_started: 'The draft has already started.',
      already_started: 'The draft has already started.',
      room_not_full: 'Everyone has to join before the draft can start.',
      not_your_turn: 'Not your pick.',
      bots_practice_only: 'Only an admin can add bots outside a practice room.',
      team_taken: 'That team is already gone.',
      not_drafting: 'The draft is not running.',
      unknown_team: 'Unknown team.',
      admin_only: 'That control is admin-only.',
      nothing_to_undo: 'There are no picks to undo.',
      no_such_pick: 'That pick no longer exists.',
      no_such_player: 'That player is already gone.',
      same_team: 'That pick already has that team.',
      bad_password: 'Wrong password.',
      draft_password_not_configured: 'No draft password is set on the server yet.',
    };

    // ── state ────────────────────────────────────────────────────────────────
    let ws = null;
    let STATE = null;
    let myId = localStorage.getItem(SEAT_KEY);
    let pendingName = null;
    let retry = 0;
    let heartbeat = null;
    let myPassword = localStorage.getItem(PW_KEY) ?? '';
    let myRole = null;              // null until the server says otherwise
    let authError = null;
    let replacing = null;           // overall pick number being re-assigned by an admin
    let showGate = false;           // re-open the password prompt to elevate to admin
    let pendingPassword = null;     // candidate password awaiting the server's verdict

    const isAdmin = () => myRole === 'admin';

    // A practice room admits you with no password at all, so the gate never
    // appears there. This is how you still get to type the admin password.
    function openGate() { showGate = true; render(); }

    const el = id => document.getElementById(id);
    const isMe = id => id && id === myId;

    function toast(msg) {
      document.querySelector('.toast')?.remove();
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3200);
    }

    function setConn(text, cls) {
      const c = el('conn');
      c.textContent = text;
      c.className = 'conn ' + (cls ?? '');
    }

    // ── socket ───────────────────────────────────────────────────────────────
    function connect() {
      const url = WORKER.replace(/^http/, 'ws') + `/room/${encodeURIComponent(ROOM)}/ws`;
      setConn('connecting');
      ws = new WebSocket(url);

      ws.addEventListener('open', () => {
        retry = 0;
        setConn('live', 'live');
        // Authenticate first; nothing else is answered until the server agrees.
        send({ type: 'auth', password: myPassword });
        // Bare "ping" is answered by the Cloudflare runtime itself, so this
        // keeps mobile networks from reaping an idle socket without ever
        // waking the draft room.
        clearInterval(heartbeat);
        heartbeat = setInterval(() => {
          if (ws?.readyState === WebSocket.OPEN) ws.send('ping');
        }, 30000);
      });

      ws.addEventListener('message', ev => {
        let m;
        try { m = JSON.parse(ev.data); } catch { return; }
        if (m.type === 'state') { STATE = m.state; render(); }
        else if (m.type === 'authRequired') {
          myRole = null;
          if (myPassword) send({ type: 'auth', password: myPassword });
          else render();
        }
        else if (m.type === 'authOk') {
          myRole = m.role;
          authError = null;
          showGate = false;
          if (pendingPassword !== null) { myPassword = pendingPassword; pendingPassword = null; }
          localStorage.setItem(PW_KEY, myPassword);
          // Re-send join so the server can update our admin flag on the seat.
          if (myId) send({ type: 'join', playerId: myId });
          render();
        }
        else if (m.type === 'authFail') {
          pendingPassword = null;
          authError = ERRORS[m.error] ?? m.error;
          // A wrong guess while already authenticated is just a failed
          // elevation; only a peer with no role at all gets locked out.
          if (!myRole) {
            myPassword = '';
            localStorage.removeItem(PW_KEY);
          }
          render();
        }
        else if (m.type === 'joined') {
          myId = m.playerId;
          localStorage.setItem(SEAT_KEY, myId);
          render();
        }
        else if (m.type === 'error') toast(ERRORS[m.error] ?? m.error);
      });

      ws.addEventListener('close', () => {
        clearInterval(heartbeat);
        setConn('offline', 'down');
        // back off, but keep trying — phones drop sockets constantly
        retry = Math.min(retry + 1, 6);
        setTimeout(connect, 400 * 2 ** retry);
      });

      ws.addEventListener('error', () => ws.close());
    }

    function send(msg) {
      if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
      else toast('Not connected yet — hang on.');
    }

    // ── actions ──────────────────────────────────────────────────────────────
    function doJoin() {
      const input = el('name-input');
      const name = input.value.trim();
      if (!name) return toast('Enter a name first.');
      pendingName = name;
      send({ type: 'join', name });
    }

    function doStart() { send({ type: 'start' }); }
    function doAddBot() {
      // A bot in a real room is a rehearsal aid that must never be mistaken for
      // a player, so adding one outside a practice room asks first.
      if (!STATE?.practice &&
          !confirm('This is not a practice room. Add a bot for rehearsal?')) return;
      send({ type: 'addBot' });
    }

    function doAuth() {
      const input = el('pw-input');
      const pw = input?.value ?? '';
      if (!pw) return toast('Enter the password.');
      // Held aside until the server accepts it, so a failed elevation attempt
      // does not discard the password that is already working.
      pendingPassword = pw;
      authError = null;
      // Already holding a role means this is a bid for admin specifically.
      send({ type: 'auth', password: pw, elevate: !!myRole });
    }

    // ── admin ────────────────────────────────────────────────────────────────
    function doUndo() { send({ type: 'undoPick' }); }
    function doRemovePlayer(id) { send({ type: 'removePlayer', playerId: id }); }

    function beginReplace(overall) {
      replacing = replacing === overall ? null : overall;
      render();
    }
    function doReplace(team) {
      send({ type: 'replacePick', overall: replacing, team });
      replacing = null;
    }

    function doReset() {
      if (!confirm('Reset this room? Every pick and player is wiped and the draft starts over.')) return;
      send({ type: 'resetRoom' });
      replacing = null;
    }
    function doLeave() {
      send({ type: 'leave', playerId: myId });
      localStorage.removeItem(SEAT_KEY);
      myId = null;
    }
    function doPick(team) { send({ type: 'pick', playerId: myId, team }); }

    async function downloadState() {
      try {
        const res = await fetch(`${WORKER}/room/${encodeURIComponent(ROOM)}/export`,
          { headers: { 'X-Draft-Password': myPassword } });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'state.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(a.href);
      } catch (e) {
        toast('Could not fetch the finished season: ' + e.message);
      }
    }

    async function showJson() {
      const res = await fetch(`${WORKER}/room/${encodeURIComponent(ROOM)}/export`,
        { headers: { 'X-Draft-Password': myPassword } });
      const text = JSON.stringify(await res.json(), null, 2);
      const pre = document.createElement('pre');
      pre.className = 'json';
      pre.textContent = text;
      el('json-slot').replaceChildren(pre);
      try {
        await navigator.clipboard.writeText(text);
        toast('Copied to clipboard.');
      } catch { /* clipboard blocked — the text is on screen regardless */ }
    }

    // ── render ───────────────────────────────────────────────────────────────
    function render() {
      // Locked out until the server grants a role, or deliberately re-opened.
      if (!myRole || showGate) {
        el('season-sub').textContent = myRole ? 'Enter admin password' : 'Password required';
        el('admin-link').style.display = 'none';
        el('stage').replaceChildren(renderGate());
        return;
      }
      el('admin-link').style.display = isAdmin() ? 'none' : '';
      if (!STATE) return;

      el('season-sub').textContent =
        `${STATE.season} · ${STATE.capacity} players · ${STATE.rounds} rounds` +
        (isAdmin() ? ' · admin' : '');

      const stage = el('stage');
      const body = STATE.phase === 'lobby' ? renderLobby()
        : STATE.phase === 'drafting' ? renderDraft()
        : renderDone();

      const bots = STATE.players.filter(p => p.bot).length;

      if (STATE.practice) {
        const banner = node('div', 'practice-banner');
        banner.appendChild(node('span', 'pb-tag', 'Practice'));
        banner.appendChild(document.createTextNode(
          ' This is a rehearsal room — nothing here affects the real draft.'));
        stage.replaceChildren(banner, body);
      } else if (bots) {
        // Bots outside a practice room mean somebody is rehearsing. Say so
        // loudly and permanently, so this is never mistaken for the real draft.
        const banner = node('div', 'practice-banner bots-warning');
        banner.appendChild(node('span', 'pb-tag warn', 'Rehearsal'));
        banner.appendChild(document.createTextNode(
          ` This room has ${bots} bot${bots === 1 ? '' : 's'} in it. Do not commit its state.json.`));
        stage.replaceChildren(banner, body);
      } else {
        stage.replaceChildren(body);
      }
    }

    function frag(...nodes) {
      const f = document.createDocumentFragment();
      nodes.filter(Boolean).forEach(n => f.appendChild(n));
      return f;
    }

    function node(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;   // textContent, never innerHTML — names are user input
      return n;
    }

    // -- password gate --
    function renderGate() {
      const box = node('div', 'section lobby');
      box.appendChild(node('h2', null, myRole ? 'Admin Access' : 'The ISC Draft'));
      box.appendChild(node('div', 'hint', myRole
        ? 'Enter the admin password to unlock undo and re-assign.'
        : 'Enter the draft password to continue.'));

      const form = node('div', 'join-form');
      const input = document.createElement('input');
      input.id = 'pw-input';
      input.type = 'password';
      input.placeholder = 'Password';
      input.autocomplete = 'current-password';
      input.addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
      const btn = node('button', 'btn', 'Enter');
      btn.onclick = doAuth;
      form.append(input, btn);

      // Only offer a way out if we already have a working role to fall back on.
      if (myRole) {
        const cancel = node('button', 'btn ghost', 'Cancel');
        cancel.onclick = () => { showGate = false; authError = null; render(); };
        form.appendChild(cancel);
      }
      box.appendChild(form);

      if (authError) box.appendChild(node('div', 'gate-error', authError));
      return box;
    }

    // -- lobby --
    function renderLobby() {
      const box = node('div', 'section lobby');
      box.appendChild(node('h2', null, 'Draft Lobby'));

      const joined = STATE.players.length;
      const need = STATE.capacity - joined;
      box.appendChild(node('div', 'hint',
        need > 0
          ? `Waiting for ${need} more player${need === 1 ? '' : 's'}…`
          : 'Everyone is in. Draw the order and start.'));

      const inRoom = STATE.players.some(p => isMe(p.id));

      if (!inRoom) {
        const form = node('div', 'join-form');
        const input = document.createElement('input');
        input.id = 'name-input';
        input.placeholder = 'Your name';
        input.maxLength = 20;
        input.autocomplete = 'off';
        if (pendingName) input.value = pendingName;
        input.addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); });
        const btn = node('button', 'btn', 'Join Draft');
        btn.disabled = joined >= STATE.capacity;
        btn.onclick = doJoin;
        form.append(input, btn);
        box.appendChild(form);
        if (joined >= STATE.capacity) box.appendChild(node('div', 'hint', 'This room is full.'));
      }

      const seats = node('div', 'seats');
      for (let i = 0; i < STATE.capacity; i++) {
        const p = STATE.players[i];
        const seat = node('div', 'seat ' + (p ? 'filled' : 'empty') +
          (p && isMe(p.id) ? ' me' : '') + (p?.bot ? ' bot' : ''));
        seat.appendChild(node('div', 'who', (p ? p.name : 'Open seat') + (p?.admin ? ' ★' : '')));
        seat.appendChild(node('div', 'tag',
          p ? (isMe(p.id) ? 'you' : p.bot ? 'bot' : 'ready') : 'waiting'));

        if (p && isAdmin()) {
          const kick = node('button', 'seat-kick', '✕');
          kick.title = `Remove ${p.name}`;
          kick.onclick = (e) => { e.stopPropagation(); doRemovePlayer(p.id); };
          seat.appendChild(kick);
        }
        seats.appendChild(seat);
      }
      box.appendChild(seats);

      if (inRoom) {
        const actions = node('div', 'done-actions');
        const start = node('button', 'btn', 'Draw Order & Start');
        start.disabled = joined < STATE.capacity;
        start.onclick = doStart;
        actions.appendChild(start);

        // Practice rooms can be filled with bots by anyone; elsewhere only an admin.
        if ((STATE.practice || isAdmin()) && joined < STATE.capacity) {
          const bot = node('button', 'btn ghost', 'Add a bot');
          bot.onclick = doAddBot;
          actions.appendChild(bot);
        }

        const leave = node('button', 'btn ghost', 'Leave');
        leave.onclick = doLeave;
        actions.appendChild(leave);
        box.appendChild(actions);
      }

      return box;
    }

    // -- drafting --
    function renderDraft() {
      const wrap = document.createDocumentFragment();

      // order + clock
      const head = node('div', 'section');
      const strip = node('div', 'order-strip');
      STATE.order.forEach(o => {
        const chip = node('div', 'order-chip' + (o.id === STATE.onClock ? ' active' : ''), o.name);
        strip.appendChild(chip);
      });
      head.appendChild(strip);

      const mine = isMe(STATE.onClock);
      const clock = node('div', 'clock' + (mine ? ' mine' : ''));
      const round = Math.floor(STATE.picks.length / STATE.capacity) + 1;
      clock.appendChild(node('div', 'meta',
        `Round ${round} of ${STATE.rounds} · Pick ${STATE.picks.length + 1} of ${STATE.totalPicks}`));
      const onClockPlayer = STATE.order.find(o => o.id === STATE.onClock);
      clock.appendChild(node('div', 'who', mine ? 'Your pick' : (onClockPlayer?.name ?? '—')));
      clock.appendChild(node('div', 'sub',
        mine ? 'Take a team below.' : onClockPlayer?.bot ? 'thinking…' : 'on the clock'));
      head.appendChild(clock);
      wrap.appendChild(head);

      // board
      const boardSection = node('div', 'section');
      boardSection.appendChild(node('div', 'section-label',
        replacing ? `Choose a replacement for pick #${replacing}` : 'Available Teams'));
      const board = node('div', 'board');
      const takenBy = {};
      STATE.picks.forEach(p => takenBy[p.team] = p.name);

      STATE.teams.forEach(abbr => {
        const owner = takenBy[abbr];
        const btn = node('button', 'team-btn' + (owner ? ' taken' : '') +
          (abbr === STATE.startChampion ? ' champ' : ''));
        // While an admin is re-assigning a pick, the board picks the new team.
        btn.disabled = replacing ? !!owner : (!!owner || !mine);
        btn.appendChild(node('span', 'abbr', abbr));
        btn.appendChild(node('span', 'full', TEAM_NAMES[abbr] ?? abbr));
        if (abbr === STATE.startChampion && !owner) {
          btn.appendChild(node('span', 'crown', 'HOLDS THE CUP'));
        }
        if (owner) btn.appendChild(node('span', 'owner', owner));
        if (!owner) btn.onclick = () => (replacing ? doReplace(abbr) : doPick(abbr));
        board.appendChild(btn);
      });
      boardSection.appendChild(board);

      if (replacing) {
        const cancel = node('button', 'btn ghost', 'Cancel re-assign');
        cancel.onclick = () => { replacing = null; render(); };
        const row = node('div', 'done-actions');
        row.appendChild(cancel);
        boardSection.appendChild(row);
      }
      wrap.appendChild(boardSection);

      if (isAdmin()) wrap.appendChild(renderAdminBar());
      wrap.appendChild(renderRosters());
      return wrap;
    }

    function renderAdminBar() {
      const box = node('div', 'section admin-bar');
      box.appendChild(node('div', 'section-label', 'Admin'));
      const row = node('div', 'done-actions');

      const undo = node('button', 'btn ghost', 'Undo last pick');
      undo.disabled = !STATE.picks.length;
      undo.onclick = doUndo;

      const reset = node('button', 'btn ghost danger', 'Reset room');
      reset.onclick = doReset;

      row.append(undo, reset);
      box.appendChild(row);
      box.appendChild(node('div', 'hint',
        'Tap any drafted team in the rosters below to swap it for a free one.'));
      return box;
    }

    function renderRosters() {
      const section = node('div', 'section');
      section.appendChild(node('div', 'section-label', 'Rosters'));
      const grid = node('div', 'rosters');

      STATE.order.forEach(o => {
        const card = node('div', 'roster' + (isMe(o.id) ? ' me' : ''));
        card.appendChild(node('h3', null,
          o.name + (isMe(o.id) ? ' (you)' : o.bot ? ' 🤖' : '')));
        const picks = STATE.picks.filter(p => p.playerId === o.id);
        for (let i = 0; i < STATE.rounds; i++) {
          const p = picks[i];
          const editable = p && isAdmin() && STATE.phase !== 'lobby';
          const slot = node('div', 'slot' + (p ? ' filled' : '') +
            (editable ? ' editable' : '') +
            (p && replacing === p.overall ? ' replacing' : ''));
          slot.appendChild(node('span', 'n', String(i + 1).padStart(2, '0')));
          slot.appendChild(document.createTextNode(p ? p.team : '—'));
          if (editable) {
            slot.title = `Re-assign pick #${p.overall}`;
            slot.onclick = () => beginReplace(p.overall);
          }
          card.appendChild(slot);
        }
        grid.appendChild(card);
      });

      section.appendChild(grid);
      return section;
    }

    // -- done --
    function renderDone() {
      const wrap = document.createDocumentFragment();

      const head = node('div', 'section lobby');
      head.appendChild(node('h2', null, 'Draft Complete'));
      head.appendChild(node('div', 'hint',
        `All ${STATE.totalPicks} teams are spoken for. ${TEAM_NAMES[STATE.startChampion] ?? STATE.startChampion} open the season holding the cup.`));

      const actions = node('div', 'done-actions');
      const dl = node('button', 'btn', 'Download state.json');
      dl.onclick = downloadState;
      const show = node('button', 'btn ghost', 'Show / copy JSON');
      show.onclick = showJson;
      actions.append(dl, show);
      head.appendChild(actions);

      const slot = node('div');
      slot.id = 'json-slot';
      head.appendChild(slot);
      wrap.appendChild(head);

      wrap.appendChild(renderRosters());
      return wrap;
    }

    connect();
  </script>
</body>

</html>
